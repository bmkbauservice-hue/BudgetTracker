<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#fbfbf8"/>
  <style>
    .title { font: 700 38px Arial, sans-serif; fill:#1f2937; }
    .sub { font: 400 20px Arial, sans-serif; fill:#6b7280; }
    .h { font: 700 24px Arial, sans-serif; fill:#111827; }
    .t { font: 400 18px Arial, sans-serif; fill:#374151; }
    .s { font: 400 16px Arial, sans-serif; fill:#4b5563; }
    .box { stroke:#374151; stroke-width:3; rx:20; ry:20; }
    .arrow { stroke:#4b5563; stroke-width:3; fill:none; marker-end:url(#arrow); }
    .label { font:700 15px Arial,sans-serif; fill:#4b5563; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/>
    </marker>
  </defs>

  <text x="800" y="62" text-anchor="middle" class="title">Budget Tracker – Projektübersicht</text>
  <text x="800" y="94" text-anchor="middle" class="sub">Grundgerüst für das Konsolenprojekt</text>

  <!-- Program -->
  <rect x="80" y="160" width="330" height="180" fill="#fff4d8" class="box"/>
  <text x="105" y="200" class="h">Program.cs / Menü</text>
  <text x="105" y="236" class="t">• Startpunkt</text>
  <text x="105" y="266" class="t">• Hauptmenü</text>
  <text x="105" y="296" class="t">• Benutzereingaben</text>

  <!-- Transaction Service -->
  <rect x="555" y="150" width="430" height="205" fill="#e7f7e7" class="box"/>
  <text x="580" y="190" class="h">TransactionService</text>
  <text x="580" y="228" class="t">• Hinzufügen / Entfernen / Abfragen</text>
  <text x="580" y="260" class="t">• Fachlogik</text>
  <text x="580" y="292" class="t">• TransactionAdded auslösen</text>
  <text x="580" y="324" class="t">• nutzt StorageService</text>

  <!-- Models -->
  <rect x="1110" y="140" width="400" height="220" fill="#eaf2ff" class="box"/>
  <text x="1135" y="180" class="h">Models</text>
  <text x="1135" y="218" class="t">TransactionType</text>
  <text x="1160" y="248" class="s">Income / Expense</text>
  <text x="1135" y="286" class="t">Transaction</text>
  <text x="1160" y="316" class="s">Id, Timestamp, Type,</text>
  <text x="1160" y="340" class="s">Description, Amount</text>

  <!-- Events -->
  <rect x="560" y="450" width="340" height="140" fill="#fff0e8" class="box"/>
  <text x="585" y="490" class="h">Events</text>
  <text x="585" y="528" class="t">TransactionAddedEventArgs</text>
  <text x="585" y="558" class="s">Ereignisdaten neuer Transaktionen</text>

  <!-- Logger -->
  <rect x="1000" y="445" width="430" height="155" fill="#f5eefe" class="box"/>
  <text x="1025" y="485" class="h">LoggerService</text>
  <text x="1025" y="523" class="t">• reagiert auf TransactionAdded</text>
  <text x="1025" y="553" class="t">• schreibt logs/transactions.log</text>

  <!-- Storage -->
  <rect x="250" y="650" width="430" height="165" fill="#e6f8fb" class="box"/>
  <text x="275" y="690" class="h">StorageService</text>
  <text x="275" y="728" class="t">• JSON speichern / laden</text>
  <text x="275" y="758" class="t">• Tagesdateien im data/-Ordner</text>
  <text x="275" y="788" class="t">• Entfernen per Id</text>

  <!-- Persistence -->
  <rect x="860" y="665" width="520" height="150" fill="#f3f4f6" class="box"/>
  <text x="885" y="705" class="h">Ordner / Dateien</text>
  <text x="885" y="742" class="t">data/ → 2026-03-14.json, 2026-03-15.json, …</text>
  <text x="885" y="775" class="t">logs/ → transactions.log</text>

  <!-- Arrows -->
  <path d="M410 250 C470 250, 500 250, 555 250" class="arrow"/>
  <text x="465" y="232" class="label">nutzt</text>

  <path d="M985 230 C1030 230, 1060 230, 1110 230" class="arrow"/>
  <text x="1018" y="212" class="label">erstellt / verwendet</text>

  <path d="M720 355 C720 395, 720 410, 720 450" class="arrow"/>
  <text x="735" y="410" class="label">löst aus</text>

  <path d="M900 520 C940 520, 960 520, 1000 520" class="arrow"/>
  <text x="916" y="503" class="label">abonniert</text>

  <path d="M620 355 C540 445, 500 540, 470 650" class="arrow"/>
  <text x="505" y="510" class="label">speichern / laden</text>

  <path d="M680 735 C755 735, 790 735, 860 735" class="arrow"/>
  <text x="735" y="718" class="label">Dateizugriff</text>

  <!-- Footer -->
  <text x="80" y="865" class="s">Projektstruktur: Models/ · Events/ · Services/ · data/ · logs/ · Program.cs · README.md · .gitignore</text>
</svg>